# Replace the server name and random path. Only public files are mapped;
# /opt/availability itself is never exposed.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    # Configure ssl_certificate and ssl_certificate_key for your VPS here.

    # Apply anti-discovery and privacy headers to every response from this host.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header Referrer-Policy "no-referrer" always;

    # robots.txt is effective only at the origin root, not below the random path.
    location = /robots.txt {
        alias /opt/availability/public/robots.txt;
        default_type text/plain;
    }

    location = /a8f2c9e71d4b {
        return 301 /a8f2c9e71d4b/;
    }

    location = /a8f2c9e71d4b/ {
        alias /opt/availability/public/index.html;
        default_type text/html;

        # For enforced privacy, create this file with `htpasswd` and uncomment:
        # auth_basic "Private availability";
        # auth_basic_user_file /etc/nginx/availability.htpasswd;
    }
}
